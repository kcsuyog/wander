<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wander · my little places</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪶</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🏔️ the animated, parallax sky scene (pure CSS + a touch of JS) -->
  <div class="sky" aria-hidden="true">
    <div class="sky-sun" data-depth="10"><span class="sun-ball"></span></div>
    <div class="cloud c1" data-depth="22"></div>
    <div class="cloud c2" data-depth="14"></div>
    <div class="cloud c3" data-depth="30"></div>
    <div class="cloud c4" data-depth="8"></div>
    <div class="sky-birds" data-depth="26">🕊️🕊️</div>
    <div class="sky-plane" data-depth="16">✈️</div>
  </div>

  <!-- 🪶 the app renders here (Preact + htm, vendored — no build step) -->
  <div id="app"></div>

  <footer class="foot">
    <p class="credits">made with 🪶 · place search &amp; maps: <a href="https://photon.komoot.io" target="_blank" rel="noopener">Photon</a> · data &amp; tiles © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></p>
    <p>
      <button type="button" class="link" id="export-btn">⬇︎ backup</button>
      <label class="link" for="import-input">⬆︎ restore</label>
      <input type="file" id="import-input" accept="application/json,.json" hidden>
      <button type="button" class="link" id="reset-btn">start over</button>
    </p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
